apiVersion: apps/v1
kind: Deployment
metadata:
  name: tier3-risk-analysis
  namespace: loan-app
  labels:
    app: tier3
    tier: backend
    component: risk-analysis
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tier3
  template:
    metadata:
      labels:
        app: tier3
        tier: backend
        component: risk-analysis
        version: v1
    spec:
      containers:
      - name: risk-analysis
        image: YOUR_ECR_REGISTRY/tier3-risk-analysis:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: TIER4_HOST
          valueFrom:
            configMapKeyRef:
              name: tier3-config
              key: TIER4_HOST
        - name: TIER4_PORT
          valueFrom:
            configMapKeyRef:
              name: tier3-config
              key: TIER4_PORT
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: tier3-service
  namespace: loan-app
  labels:
    app: tier3
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: tier3

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tier3-risk-analysis
  namespace: loan-app
  labels:
    app: tier3
    tier: backend
    component: risk-analysis
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tier3
  template:
    metadata:
      labels:
        app: tier3
        tier: backend
        component: risk-analysis
        version: v1
    spec:
      containers:
      - name: risk-analysis
        image: 537309256512.dkr.ecr.us-east-1.amazonaws.com/tier3-risk-analysis:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: TIER4_HOST
          valueFrom:
            configMapKeyRef:
              name: tier3-config
              key: TIER4_HOST
        - name: TIER4_PORT
          valueFrom:
            configMapKeyRef:
              name: tier3-config
              key: TIER4_PORT
        volumeMounts:
        - name: logs
          mountPath: /var/log/loan-risk-engine
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

      # Sidecar: tails the C app's JSON log file and ships via OTLP HTTP
      - name: otel-log-collector
        image: otel/opentelemetry-collector-contrib:0.104.0
        args:
          - --config=/etc/otelcol/config.yaml
        volumeMounts:
        - name: logs
          mountPath: /var/log/loan-risk-engine
          readOnly: true
        - name: otel-sidecar-config
          mountPath: /etc/otelcol
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi

      volumes:
      - name: logs
        emptyDir: {}
      - name: otel-sidecar-config
        configMap:
          name: tier3-otel-sidecar-config
---
apiVersion: v1
kind: Service
metadata:
  name: tier3-service
  namespace: loan-app
  labels:
    app: tier3
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: tier3

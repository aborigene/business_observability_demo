apiVersion: dynatrace.com/v1beta5
kind: DynaKube
metadata:
  name: loan-app-dynakube
  namespace: dynatrace
  annotations:
    feature.dynatrace.com/k8s-app-enabled: "true"
spec:
  apiUrl: https://fov31014.live.dynatrace.com/api
  tokens: loan-app-dynakube-tokens

  # ActiveGate handles routing and Kubernetes monitoring
  activeGate:
    capabilities:
      - routing
      - kubernetes-monitoring
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

  # Application monitoring via init-container injection (works on EKS Fargate)
  # No namespaceSelector = covers all namespaces in the cluster
  oneAgent:
    applicationMonitoring: {}

  # Enrich spans and metrics with Kubernetes metadata
  metadataEnrichment:
    enabled: true

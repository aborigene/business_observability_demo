apiVersion: apps/v1
kind: Deployment
metadata:
  name: tier5-loan-finalizer
  namespace: loan-app
  labels:
    app: tier5
    tier: backend
    component: loan-finalizer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tier5
  template:
    metadata:
      labels:
        app: tier5
        tier: backend
        component: loan-finalizer
        version: v1
    spec:
      containers:
      - name: loan-finalizer
        image: 537309256512.dkr.ecr.us-east-1.amazonaws.com/tier5-loan-finalizer:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP
        env:
        - name: ASPNETCORE_URLS
          valueFrom:
            configMapKeyRef:
              name: tier5-config
              key: ASPNETCORE_URLS
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: tier5-config
              key: ASPNETCORE_ENVIRONMENT
        - name: Loan__BaseRate
          valueFrom:
            configMapKeyRef:
              name: tier5-config
              key: Loan__BaseRate
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: tier5-secret
              key: DATABASE_URL
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://dynatrace-otelcol.dynatrace:4317"
        - name: OTEL_SERVICE_NAME
          value: "tier5-loan-finalizer"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: tier5-service
  namespace: loan-app
  labels:
    app: tier5
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: tier5

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tier5-hpa
  namespace: loan-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tier5-loan-finalizer
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
